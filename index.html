<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pokemon Racing Game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%23f7f9fc' stroke='%2315181f' stroke-width='3'/%3E%3Cpath d='M2 20 A18 18 0 0 1 38 20 Z' fill='%23e8433c' stroke='%2315181f' stroke-width='3'/%3E%3Crect x='2' y='17' width='36' height='6' fill='%2315181f'/%3E%3Ccircle cx='20' cy='20' r='7' fill='%23f7f9fc' stroke='%2315181f' stroke-width='3'/%3E%3C/svg%3E" />
<style>
  /* ---------------------------------------------------------------- base */
  *, *::before, *::after { box-sizing: border-box; }
  /* `hidden` must always win: several HUD nodes set display:flex/grid in a rule
     of equal specificity, which would otherwise leave ghost panels on screen. */
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: #050a1c; overflow: hidden; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", Verdana, system-ui, sans-serif;
    color: #eef4ff;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  button { font: inherit; color: inherit; }

  #pkr-root { position: fixed; inset: 0; overflow: hidden; background: #050a1c; }
  #pkr-canvas { position: absolute; inset: 0; display: block; }
  #pkr-stage {
    position: absolute; left: 50%; top: 50%;
    width: 1600px; height: 900px; margin: -450px 0 0 -800px;
    transform: scale(var(--ui, 1)); transform-origin: center center;
  }
  #pkr-stage > div { position: absolute; inset: 0; }
  #pkr-layer-screen, #pkr-layer-hud, #pkr-layer-overlay { pointer-events: none; }
  #pkr-layer-screen > *, #pkr-layer-hud > *, #pkr-layer-overlay > * { pointer-events: auto; }
  .scr { position: absolute; inset: 0; }

  /* ---------------------------------------------------------------- atoms */
  .pkr-logo {
    display: inline-flex; flex-direction: column; align-items: center; line-height: .92;
    transform: scale(var(--logo-scale, 1)); transform-origin: center;
  }
  .pkr-logo-word {
    font-size: 58px; font-weight: 900; font-style: italic; letter-spacing: .01em;
    background: linear-gradient(180deg, #fff8c8 8%, #ffd83c 46%, #f0a416 74%, #ffe98a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 3px #23409a;
    paint-order: stroke fill;
    filter: drop-shadow(0 4px 0 #16265e) drop-shadow(0 0 14px rgba(60,140,255,.55));
  }
  .pkr-logo-sub {
    margin-top: 4px; padding: 3px 14px 2px; border-radius: 5px;
    background: linear-gradient(180deg, #e8433c, #b31f26);
    border: 2px solid #f6f8fc;
    font-size: 16px; font-weight: 800; letter-spacing: .3em; color: #fff;
    box-shadow: 0 3px 10px rgba(0,0,0,.5);
  }

  .neon-plate {
    margin: 0; padding: 10px 46px 12px;
    font-size: 62px; font-weight: 900; font-style: italic; letter-spacing: .04em;
    color: #dff6ff;
    text-shadow: 0 0 18px rgba(70,220,255,.9), 0 4px 0 #123, 0 0 46px rgba(255,60,200,.5);
    border: 3px solid rgba(120,235,255,.85); border-radius: 999px;
    background: linear-gradient(180deg, rgba(20,40,90,.72), rgba(12,22,60,.82));
    box-shadow: 0 0 26px rgba(80,220,255,.55), inset 0 0 30px rgba(60,180,255,.28),
                0 0 60px rgba(255,60,200,.25);
  }

  .panel {
    background: linear-gradient(180deg, rgba(20,40,86,.88), rgba(10,20,52,.92));
    border: 2px solid rgba(110,215,255,.72); border-radius: 18px;
    box-shadow: 0 0 22px rgba(50,180,255,.32), inset 0 0 34px rgba(24,72,160,.45);
  }

  .pkr-hints { display: flex; gap: 34px; justify-content: center; }
  .pkr-hint {
    padding: 9px 26px; border-radius: 10px;
    background: linear-gradient(180deg, rgba(14,26,58,.92), rgba(8,14,38,.95));
    border: 2px solid rgba(150,180,220,.5);
    font-size: 22px; font-weight: 800; letter-spacing: .06em; color: #eaf2ff;
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
  }
  .pkr-hint b { color: #ffd63b; }

  .pkr-stats { display: grid; gap: 10px; }
  .pkr-stats.compact { gap: 6px; }
  .pkr-stat-row { display: grid; grid-template-columns: 168px 1fr; align-items: center; gap: 12px; }
  .pkr-stats.compact .pkr-stat-row { grid-template-columns: 120px 1fr; gap: 8px; }
  .pkr-stat-label { font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #dbe8ff; }
  .pkr-stats.compact .pkr-stat-label { font-size: 14px; }
  .pkr-stat-track { display: flex; gap: 4px; height: 18px; }
  .pkr-stats.compact .pkr-stat-track { height: 12px; }
  .pkr-stat-track i {
    flex: 1; border-radius: 3px; background: #22304e; border: 1px solid rgba(255,255,255,.08);
  }
  .pkr-stat-track i.on { background: linear-gradient(180deg, #8fe4ff, #2f8fe0); box-shadow: 0 0 8px rgba(80,200,255,.7); }
  .pkr-stat-track i.on.warm { background: linear-gradient(180deg, #ffd06a, #f08a1c); box-shadow: 0 0 8px rgba(255,170,50,.7); }

  .pkr-card {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
    width: 100%; padding: 8px 4px 6px; cursor: pointer;
    background: linear-gradient(180deg, rgba(38,66,124,.9), rgba(20,38,84,.92));
    border: 2px solid rgba(120,170,230,.45); border-radius: 12px;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .pkr-card:hover { transform: translateY(-2px); }
  .pkr-card.selected {
    border-color: #b98cff;
    box-shadow: 0 0 0 3px rgba(190,120,255,.55), 0 0 24px rgba(170,110,255,.6);
    background: linear-gradient(180deg, rgba(60,88,160,.95), rgba(28,48,104,.95));
  }
  .pkr-card-tag {
    position: absolute; top: -12px; left: -8px; padding: 2px 9px; border-radius: 6px;
    background: linear-gradient(180deg, #a97cff, #6b3fd6); border: 2px solid #eae2ff;
    font-size: 15px; font-weight: 900; letter-spacing: .04em;
  }
  .pkr-card-art { display: block; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
  .pkr-card-name {
    width: 100%; padding: 3px 0 2px; border-radius: 6px; text-align: center;
    background: rgba(8,16,40,.72);
    font-size: 16px; font-weight: 900; letter-spacing: .04em; color: #f2f7ff;
  }

  /* ---------------------------------------------------------------- title */
  .scr-title { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .title-glow {
    position: absolute; left: 50%; top: 38%; width: 1100px; height: 560px; margin-left: -550px; margin-top: -280px;
    background: radial-gradient(ellipse at center, rgba(60,170,255,.35), rgba(6,12,36,0) 68%);
    filter: blur(6px);
  }
  .scr-title .pkr-logo { margin-top: -40px; }
  .title-tag {
    margin-top: 46px; font-size: 22px; font-weight: 800; letter-spacing: .42em; color: #9fd8ff;
    text-shadow: 0 0 16px rgba(70,200,255,.8);
  }
  .title-menu { display: flex; flex-direction: column; gap: 14px; margin-top: 30px; }
  .title-item {
    display: flex; align-items: center; gap: 16px; width: 460px; padding: 12px 26px; cursor: pointer;
    background: linear-gradient(180deg, rgba(22,44,96,.86), rgba(10,20,54,.9));
    border: 2px solid rgba(120,200,255,.45); border-radius: 14px;
    font-size: 30px; font-weight: 900; font-style: italic; letter-spacing: .08em;
    text-shadow: 0 2px 0 rgba(0,0,0,.5);
  }
  .title-item .ball { display: flex; opacity: .5; }
  .title-item.on {
    border-color: #ffd63b; color: #fff6cf;
    box-shadow: 0 0 26px rgba(255,200,60,.5), inset 0 0 20px rgba(255,190,60,.25);
    transform: translateX(10px);
  }
  .title-item.on .ball { opacity: 1; }
  .title-press {
    margin-top: 26px; font-size: 26px; font-weight: 900; letter-spacing: .18em; color: #eaf4ff;
    animation: blink 1.4s steps(2, end) infinite;
  }
  .title-press b { color: #ffd63b; }
  @keyframes blink { 50% { opacity: .28; } }
  .title-roster {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px;
    display: flex; align-items: flex-end; gap: 18px; padding: 12px 30px 10px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(14,26,66,.55), rgba(6,12,34,.78));
    border: 2px solid rgba(120,190,255,.28);
    box-shadow: 0 -10px 40px rgba(60,150,255,.16), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .title-hero {
    display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1;
    filter: drop-shadow(0 0 18px color-mix(in srgb, var(--c) 65%, transparent));
  }
  .title-hero i {
    font-style: normal; font-size: 12px; font-weight: 800; letter-spacing: .14em;
    color: color-mix(in srgb, var(--c) 78%, #ffffff);
    text-shadow: 0 2px 6px rgba(0,0,0,.7);
  }

  /* ------------------------------------------------------- menus (shared) */
  .scr-head { position: absolute; top: 22px; left: 34px; right: 34px; display: flex; align-items: center; gap: 28px; }
  .scr-head .pkr-logo { flex: 0 0 auto; }
  .scr-title { }
  .scr-head .scr-title { margin: 0 auto; }
  .scr-foot { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; }

  .select-body { position: absolute; left: 34px; right: 34px; top: 138px; bottom: 96px; display: flex; gap: 22px; }
  .grid-panel { flex: 1; padding: 20px; display: flex; }
  .racer-grid {
    flex: 1; display: grid; grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: 1fr; gap: 16px;
  }
  .racer-grid .pkr-card { justify-content: center; }
  .side-col { width: 470px; display: flex; flex-direction: column; gap: 18px; }
  .preview-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; position: relative; overflow: hidden; }
  .preview-panel::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 60%, rgba(90,190,255,.22), rgba(0,0,0,0) 70%);
  }
  .preview-art { filter: drop-shadow(0 12px 18px rgba(0,0,0,.5)); }
  .preview-type {
    margin-top: 4px; padding: 4px 18px; border-radius: 999px; font-size: 17px; font-weight: 900; letter-spacing: .16em;
    background: color-mix(in srgb, var(--c) 30%, rgba(10,20,50,.8)); border: 2px solid var(--c);
  }
  .stat-panel { padding: 18px 26px 22px; }
  .stat-name { margin: 0 0 14px; font-size: 42px; font-weight: 900; font-style: italic; letter-spacing: .04em; text-align: center; text-shadow: 0 3px 0 rgba(0,0,0,.45); }
  .stat-tag { margin: 14px 0 0; text-align: center; font-size: 16px; color: #a9c4e8; letter-spacing: .06em; }

  /* ---------------------------------------------------------- track select */
  .track-body { position: absolute; left: 34px; right: 34px; top: 138px; bottom: 96px; display: flex; gap: 22px; }
  .track-list { width: 430px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .track-row {
    display: grid; grid-template-columns: 34px 210px 1fr; align-items: center; gap: 10px;
    padding: 10px; cursor: pointer; text-align: left;
    background: linear-gradient(180deg, rgba(30,58,116,.9), rgba(16,30,72,.92));
    border: 2px solid rgba(120,170,230,.4); border-radius: 12px;
  }
  .track-row .track-thumb { display: block; overflow: hidden; border-radius: 8px; line-height: 0; border: 2px solid rgba(180,220,255,.3); }
  .track-num { font-size: 24px; font-weight: 900; font-style: italic; color: #ffd63b; }
  .track-row-name { grid-column: 1 / -1; padding-top: 6px; font-size: 21px; font-weight: 900; letter-spacing: .05em; }
  .track-row.on { border-color: #6fe0ff; box-shadow: 0 0 0 3px rgba(90,220,255,.35), 0 0 24px rgba(60,190,255,.5); }
  .cup-note {
    margin-top: auto; padding: 14px 16px; border-radius: 12px;
    background: rgba(8,18,44,.55); border: 2px dashed rgba(140,200,255,.3); text-align: center;
  }
  .cup-title { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 20px; font-weight: 900; letter-spacing: .1em; color: #ffd63b; }
  .cup-row { margin-top: 6px; font-size: 14px; letter-spacing: .1em; color: #a9c8ea; }
  .cup-row b { color: #eaf4ff; }
  .track-preview { flex: 1; padding: 16px; display: flex; flex-direction: column; }
  .track-preview-art { flex: 1; overflow: hidden; border-radius: 12px; line-height: 0; border: 2px solid rgba(160,220,255,.35); }
  .track-preview-art svg { width: 100%; height: 100%; display: block; }
  .track-preview-name {
    margin-top: 14px; text-align: center; font-size: 40px; font-weight: 900; font-style: italic; letter-spacing: .06em;
    text-shadow: 0 3px 0 rgba(0,0,0,.5), 0 0 22px rgba(80,200,255,.5);
  }
  .track-meta { margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 16px; color: #a9c8ea; letter-spacing: .08em; }
  .track-meta .dot { width: 6px; height: 6px; border-radius: 50%; background: #5aa8e0; }

  /* ------------------------------------------------------------------ race */
  .hud-tl { position: absolute; top: 24px; left: 30px; }
  .hud-pods { display: flex; align-items: center; }
  .hud-pod {
    width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 38% 30%, #5b6272, #191d29 72%);
    border: 5px solid #e9eef8; box-shadow: 0 6px 18px rgba(0,0,0,.55), inset 0 0 18px rgba(0,0,0,.6);
  }
  .hud-pod.portrait { width: 92px; height: 92px; background: radial-gradient(circle at 38% 30%, #7b8496, #232838 72%); }
  .hud-pod.item { margin-left: -18px; }
  .item-empty { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.08); border: 2px dashed rgba(255,255,255,.25); display: block; }
  .hud-coins {
    display: inline-flex; align-items: center; gap: 10px; margin: 10px 0 0 6px; padding: 6px 20px 6px 8px;
    border-radius: 999px; background: rgba(10,16,34,.72); border: 2px solid rgba(220,232,255,.35);
  }
  .hud-coins .coin {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(180deg, #ffe071, #e09a10); border: 2px solid #fff3c4;
    font-size: 18px; font-weight: 900; color: #8a5a00;
  }
  .hud-coins b { font-size: 38px; font-weight: 900; font-style: italic; color: #ffd63b; text-shadow: 0 3px 0 rgba(0,0,0,.55); }

  .hud-tr { position: absolute; top: 18px; right: 40px; display: flex; align-items: flex-start; }
  .pos-num {
    font-size: 128px; line-height: .9; font-weight: 900; font-style: italic;
    background: linear-gradient(180deg, #fff6c8, #ffd035 55%, #e79a12);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 4px #fff; paint-order: stroke fill;
    filter: drop-shadow(0 5px 0 rgba(0,0,0,.5));
  }
  .pos-ord {
    font-size: 56px; font-weight: 900; font-style: italic; color: #ffd63b;
    -webkit-text-stroke: 3px #fff; paint-order: stroke fill; margin-top: 6px;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,.5));
  }
  .pos-total {
    align-self: flex-end; margin: 0 0 12px 6px; font-size: 46px; font-weight: 900; font-style: italic;
    color: #f4f8ff; -webkit-text-stroke: 2px rgba(20,30,60,.8); paint-order: stroke fill;
  }

  .hud-bl {
    position: absolute; left: 34px; bottom: 30px; display: flex; align-items: center; gap: 14px;
    padding: 8px 22px; border-radius: 14px; background: rgba(10,16,34,.72);
    border: 2px solid rgba(220,232,255,.3); box-shadow: 0 6px 18px rgba(0,0,0,.45);
  }
  .lap-label { font-size: 44px; font-weight: 900; font-style: italic; color: #ffd63b; text-shadow: 0 3px 0 rgba(0,0,0,.5); }
  .lap-val { display: flex; align-items: baseline; padding: 2px 16px; border-radius: 10px; background: rgba(60,70,92,.85); }
  .lap-val b { font-size: 52px; font-weight: 900; font-style: italic; }
  .lap-val i { font-size: 30px; font-style: italic; font-weight: 900; opacity: .85; }

  .hud-br { position: absolute; right: 26px; bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .minimap {
    padding: 8px; border-radius: 16px; line-height: 0;
    background: rgba(10,18,40,.5); border: 2px solid rgba(180,215,255,.28);
  }
  .hud-speed {
    position: absolute; right: 296px; bottom: 28px; display: flex; align-items: baseline; gap: 7px;
    padding: 4px 18px 8px; border-radius: 14px;
    background: linear-gradient(180deg, rgba(12,22,50,.72), rgba(6,12,30,.82));
    border: 2px solid rgba(180,215,255,.3);
    color: #eaf6ff; text-shadow: 0 3px 8px rgba(0,0,0,.75);
  }
  .hud-speed b { font-size: 46px; font-weight: 900; font-style: italic; }
  .hud-speed span { font-size: 18px; font-weight: 800; letter-spacing: .1em; opacity: .8; }

  .countdown { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); text-align: center; }
  .lights {
    display: flex; gap: 12px; padding: 12px 16px; border-radius: 14px;
    background: linear-gradient(180deg, rgba(20,26,44,.92), rgba(8,12,26,.94));
    border: 3px solid rgba(120,215,255,.6); box-shadow: 0 0 30px rgba(60,190,255,.45);
  }
  .light { display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 10px; background: rgba(0,0,0,.55); }
  .light i {
    width: 44px; height: 44px; border-radius: 50%; display: block;
    background: radial-gradient(circle at 36% 32%, #ff7c72, #8c1a16 70%);
    box-shadow: inset 0 0 10px rgba(0,0,0,.6), 0 0 12px rgba(255,80,60,.5);
  }
  .light.go i { background: radial-gradient(circle at 36% 32%, #b5ffa8, #1f8f2a 70%); box-shadow: inset 0 0 10px rgba(0,0,0,.5), 0 0 18px rgba(90,255,120,.7); }
  .count-text {
    margin-top: 16px; display: inline-block; padding: 6px 30px 12px; border-radius: 18px;
    font-size: 62px; font-weight: 900; font-style: italic; letter-spacing: .06em;
    background: linear-gradient(180deg, rgba(10,18,44,.66), rgba(5,10,26,.78));
    border: 2px solid rgba(150,205,255,.3);
    color: #fff;
    text-shadow: 0 4px 0 rgba(0,0,0,.6), 0 0 26px rgba(90,200,255,.75);
    -webkit-text-stroke: 2px rgba(12,18,40,.85); paint-order: stroke fill;
  }
  .count-text .c3, .count-text .c2 { color: #ff6b6b; }
  .count-text .c1 { color: #ffd63b; }
  .count-text .go { color: #7dffa0; }
  .count-text .dim { color: #cfe2ff; opacity: .72; }

  .item-flash {
    position: absolute; right: 300px; bottom: 120px; display: flex; align-items: center; gap: 12px;
    padding: 10px 20px 10px 12px; border-radius: 14px;
    background: linear-gradient(180deg, rgba(18,32,70,.92), rgba(8,16,42,.95));
    border: 2px solid rgba(255,214,59,.7); box-shadow: 0 0 26px rgba(255,200,60,.45);
  }
  .item-flash b { font-size: 26px; font-weight: 900; letter-spacing: .04em; }

  /* --------------------------------------------------------------- results */
  .results-head { position: absolute; top: 20px; left: 34px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .results-track { font-size: 16px; font-weight: 800; letter-spacing: .14em; color: #9fd2ff; text-align: center; max-width: 230px; }
  .results-banner {
    position: absolute; left: 50%; top: 40px; transform: translateX(-50%);
    min-width: 700px; padding: 16px 40px; display: grid; gap: 4px;
  }
  .banner-row { display: grid; grid-template-columns: 118px 1fr auto; align-items: baseline; gap: 16px; }
  .banner-place { font-size: 44px; font-weight: 900; font-style: italic; }
  .banner-name { font-size: 44px; font-weight: 900; font-style: italic; letter-spacing: .04em; }
  .banner-time { font-size: 22px; font-weight: 800; color: #a9c8ea; }
  .r1 .banner-place, .r1 .banner-name { color: #ffd63b; text-shadow: 0 3px 0 rgba(0,0,0,.45); }
  .r2 .banner-place, .r2 .banner-name { color: #dfe9f8; }
  .r3 .banner-place, .r3 .banner-name { color: #f0a464; }

  .podium { position: absolute; left: 50%; bottom: 108px; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 26px; }
  .podium-col { display: flex; flex-direction: column; align-items: center; }
  .podium-kart { filter: drop-shadow(0 12px 16px rgba(0,0,0,.5)); margin-bottom: -12px; }
  .podium-block {
    width: 250px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    border-radius: 12px 12px 6px 6px; padding-top: 10px;
    box-shadow: inset 0 6px 20px rgba(255,255,255,.2), 0 10px 22px rgba(0,0,0,.45);
  }
  .podium-block.b1 { height: 178px; background: linear-gradient(180deg, #ffd96b, #c98a12); width: 280px; }
  .podium-block.b2 { height: 132px; background: linear-gradient(180deg, #e8eef8, #9aa8bd); }
  .podium-block.b3 { height: 106px; background: linear-gradient(180deg, #e2a06a, #9c5c28); }
  .podium-place { font-size: 48px; font-weight: 900; font-style: italic; color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .podium-name { font-size: 20px; font-weight: 900; letter-spacing: .08em; color: rgba(20,26,44,.85); }
